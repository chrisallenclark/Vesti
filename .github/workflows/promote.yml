# Move one strategy along the promotion ladder.
#
# Separate from the bootstrap because the bootstrap contains steps that must
# happen exactly once — `--deposit` records an external transfer, and running it
# twice would assert capital that was never transferred and make every position
# size after it wrong. Promoting a strategy has no such hazard and is something
# an operator does repeatedly, so it gets its own entry point rather than being
# reachable only by re-running something dangerous.
#
# TWO WAYS IN, because `workflow_dispatch` is refused for the token this project
# is driven by and a mechanism that only works from a browser is not automation.
# The file trigger is the one that works unattended: write the request into
# `.github/promote-request` and commit it. Its format is one field per line.
#
#   slug: day.opening_range_breakout
#   to: paper_approved
#   why: <the rationale, recorded permanently against the promotion>
#
# The ladder still moves one rung per call and a rationale is still required.
# That is the point of the ladder: why a rule set was allowed to trade is
# written at the moment it is allowed, by whoever allowed it, and cannot be
# reconstructed afterwards.
name: Strategy — promote

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Strategy slug, e.g. day.opening_range_breakout"
        required: true
      to:
        description: "Rung to move to"
        required: true
        type: choice
        options: [validating, paper_approved, paused, retired]
        default: validating
      why:
        description: "Rationale. Recorded permanently against the promotion."
        required: true
  push:
    paths: [".github/promote-request"]

concurrency:
  group: paper-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      TRADING_MODE: PAPER
      # setup.mts prompts for this when it is unset, and a prompt in an
      # unattended job is a hang that reads as a failure.
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT || 'Vesti Research chrisallenclarkjr@gmail.com' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Configure
        run: npm run setup -- --no-ingest < /dev/null

      # Idempotent, and lands only unregistered rule sets at `experimental` — it
      # never resets one that has already been promoted.
      - name: Register strategies
        run: npm run session -w @vesti/execution -- --register

      # One request file may carry several rungs, one per block, so a strategy
      # can be walked from experimental to paper_approved in a single commit
      # while still recording a separate rationale for each step.
      - name: Read the request
        id: request
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'slug: %s\nto: %s\nwhy: %s\n' \
              "${{ inputs.slug }}" "${{ inputs.to }}" "${{ inputs.why }}" > /tmp/promote-request
          else
            cp .github/promote-request /tmp/promote-request
          fi
          cat /tmp/promote-request

      - name: Promote
        run: |
          slug=""; to=""; why=""
          apply() {
            [ -n "$slug" ] && [ -n "$to" ] && [ -n "$why" ] || return 0
            echo "── $slug -> $to"
            npm run session -w @vesti/execution -- --promote "$slug" --to "$to" --why "$why"
            slug=""; to=""; why=""
          }
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              slug:*) apply; slug="${line#slug:}"; slug="${slug# }" ;;
              to:*)   to="${line#to:}";     to="${to# }" ;;
              why:*)  why="${line#why:}";   why="${why# }" ;;
            esac
          done < /tmp/promote-request
          apply

      - name: Standing
        if: always()
        run: npm run session -w @vesti/execution -- --status
